name: V3-02 Clean Experiment Topics

on:
  push:
    branches:
      - 'v3-02/odometry-separation'
    paths:
      - '.github/workflows/v3-02-clean-experiment-topics.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-02/odometry-separation
      - name: Remove retired mapping namespace from experiment profile and test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path('src/agt_experiment_manager/config/bag_profiles.yaml'),
              Path('src/agt_experiment_manager/test/test_experiment_manager.py'),
          ]
          for path in targets:
              lines = path.read_text(encoding='utf-8').splitlines()
              lines = [line for line in lines if '/agt/mapping/' not in line]
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name 'Xuan Yang'
          git config user.email 'xuanyang.robotics@gmail.com'
          git add src/agt_experiment_manager/config/bag_profiles.yaml src/agt_experiment_manager/test/test_experiment_manager.py
          git commit -m 'refactor(v3-02): drop retired mapping experiment topics'
          git push origin HEAD:v3-02/odometry-separation
