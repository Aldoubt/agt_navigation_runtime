name: V3-02 Apply Consumer Migration

on:
  push:
    branches:
      - 'v3-02/odometry-separation'
    paths:
      - '.github/workflows/v3-02-apply-consumer-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-02/odometry-separation
      - name: Apply whitelisted runtime interface replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('src/agt_localization/README.md'),
              Path('src/agt_localization/src/relocalization_node.cpp'),
              Path('src/agt_localization/test/test_v25_10_validation_contract.py'),
              Path('src/agt_localization/config/relocalization_handheld_validation.yaml'),
              Path('src/agt_localization/config/relocalization.yaml'),
              Path('src/agt_localization/scripts/v25_10_realbag_validation.py'),
              Path('src/agt_localization/rviz/v25_10_realbag_validation.rviz'),
              Path('src/agt_perception/README.md'),
              Path('src/agt_perception/src/local_obstacle_filter.cpp'),
              Path('src/agt_perception/config/local_obstacle_filter.yaml'),
              Path('src/agt_navigation/config/nav2_bunker.yaml'),
              Path('src/agt_navigation/scripts/differential_drive_simulator.py'),
              Path('src/agt_navigation/scripts/route_controller_smoke.py'),
              Path('src/agt_navigation/scripts/route_system_smoke.py'),
              Path('src/agt_experiment_manager/agt_experiment_manager/manager.py'),
              Path('src/agt_experiment_manager/test/test_experiment_manager.py'),
              Path('src/agt_experiment_manager/config/bag_profiles.yaml'),
          ]
          replacements = (
              ('/agt/mapping/registered_points', '/agt/odometry/registered_points'),
              ('/agt/mapping/odometry', '/agt/odometry/odometry'),
              ('agt_mapping_fast_livo2_adapter', 'agt_odometry_fast_livo2_adapter'),
              ('fast_livo2_mapping.launch.py', 'fast_livo2_odometry.launch.py'),
              ('agt_mapping', 'agt_odometry'),
              ('source ~/agt_navigation_v2/install/setup.bash', 'source ~/agt_navigation_runtime/install/setup.bash'),
          )

          changed = []
          for path in paths:
              original = path.read_text(encoding='utf-8')
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('changed files:')
          for path in changed:
              print(path)
          PY
          git diff --check
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No migration changes required'
            exit 0
          fi
          git config user.name 'Xuan Yang'
          git config user.email 'xuanyang.robotics@gmail.com'
          git add src/agt_localization src/agt_perception src/agt_navigation src/agt_experiment_manager
          git commit -m 'refactor(v3-02): migrate runtime consumers to odometry contract'
          git push origin HEAD:v3-02/odometry-separation
