name: Runtime Contracts

on:
  push:
    branches:
      - 'v3-01/**'
      - 'feat/v3-01-*'
      - 'v3-02/**'
      - 'v3-03/**'
      - 'v3-04/**'
  pull_request:
    paths:
      - 'profiles/platforms/**'
      - 'schemas/**'
      - 'tools/runtime_contracts/**'
      - 'tools/validate_runtime_contracts.py'
      - 'tests/contracts/**'
      - 'tests/odometry/**'
      - 'tests/execution/**'
      - 'src/agt_interfaces/**'
      - 'src/agt_odometry/**'
      - 'src/agt_mapping/**'
      - 'src/agt_localization/**'
      - 'src/agt_perception/**'
      - 'src/agt_navigation/**'
      - 'src/agt_safety/**'
      - 'src/agt_chassis/**'
      - 'src/agt_chassis_bunker/**'
      - 'src/agt_chassis_mk_mini/**'
      - 'src/agt_chassis_mk_mini_sim/**'
      - 'src/agt_experiment_manager/**'
      - 'requirements-contracts.txt'
      - '.github/workflows/runtime-contracts.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install contract test dependencies
        run: python -m pip install -r requirements-contracts.txt
      - name: Run V3-01 contract tests
        run: python -m pytest -q tests/contracts
      - name: Run V3-02 odometry source contracts
        run: python -m pytest -q tests/odometry
      - name: Run V3-03/V3-04 execution source contracts
        run: python -m pytest -q tests/execution
      - name: Run V3-04 virtual-CAN simulator pure tests
        run: python -m pytest -q src/agt_chassis_mk_mini_sim/test
