name: Runtime Contracts

on:
  push:
    branches:
      - 'v3-01/**'
      - 'feat/v3-01-*'
      - 'v3-02/**'
      - 'v3-03/**'
      - 'feat/runtime-convergence-*'
      - 'feat/runtime-site-*'
      - 'feat/runtime-navigation-convergence-*'
  pull_request:
    paths:
      - 'profiles/platforms/**'
      - 'schemas/**'
      - 'tools/runtime_contracts/**'
      - 'tools/validate_runtime_contracts.py'
      - 'tests/contracts/**'
      - 'tests/odometry/**'
      - 'tests/execution/**'
      - 'tests/system_manager/**'
      - 'tests/site_runtime/**'
      - 'tests/navigation/**'
      - 'src/agt_interfaces/**'
      - 'src/agt_runtime_contracts/**'
      - 'src/agt_site_runtime/**'
      - 'src/agt_odometry/**'
      - 'src/agt_mapping/**'
      - 'src/agt_localization/**'
      - 'src/agt_perception/**'
      - 'src/agt_navigation/**'
      - 'src/agt_safety/**'
      - 'src/agt_chassis/**'
      - 'src/agt_chassis_bunker/**'
      - 'src/agt_chassis_mk_mini/**'
      - 'src/agt_system_manager/**'
      - 'src/agt_experiment_manager/**'
      - 'requirements-contracts.txt'
      - '.github/workflows/runtime-contracts.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install contract test dependencies
        run: python -m pip install -r requirements-contracts.txt
      - name: Run V3-01 contract tests
        run: python -m pytest -q tests/contracts
      - name: Run V3-02 odometry source contracts
        run: python -m pytest -q tests/odometry
      - name: Run V3-03 execution source contracts
        run: python -m pytest -q tests/execution
      - name: Run runtime system-manager contracts
        run: |
          if [ -d tests/system_manager ]; then
            PYTHONPATH=src/agt_system_manager python -m pytest -q tests/system_manager
          else
            echo "tests/system_manager not present yet; convergence TDD has not reached that task"
          fi
      - name: Run runtime site-owner contracts
        run: |
          if [ -d src/agt_site_runtime/test ]; then
            PYTHONPATH=src/agt_site_runtime:src/agt_runtime_contracts python -m pytest -q src/agt_site_runtime/test tests/site_runtime
          elif [ -d tests/site_runtime ]; then
            PYTHONPATH=src/agt_site_runtime:src/agt_runtime_contracts python -m pytest -q tests/site_runtime
          else
            echo "site-runtime tests not present yet; site-owner TDD has not reached that task"
          fi
      - name: Run P1 task-storage contracts
        run: |
          if [ -f src/agt_navigation/test/test_site_task_binding.py ]; then
            PYTHONPATH=src/agt_navigation:src/agt_site_runtime:src/agt_runtime_contracts \
              python -m pytest -q \
                src/agt_navigation/test/test_site_task_binding.py \
                src/agt_navigation/test/test_task_registry.py \
                src/agt_navigation/test/test_task_group.py \
                src/agt_navigation/test/test_route_task_binding.py \
                tests/navigation/test_task_storage_source_contract.py
          else
            echo "P1 task-storage tests not present yet"
          fi
