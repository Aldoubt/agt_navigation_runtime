name: operator-gateway-no-ros

on:
  push:
    branches:
      - feat/operator-gateway-p0
      - feat/operator-gateway-p1-mission-control
      - feat/operator-gateway-control-lease
    paths:
      - 'src/agt_operator_gateway/**'
      - 'src/agt_interfaces/msg/**'
      - 'src/agt_interfaces/action/**'
      - 'src/agt_interfaces/srv/**'
      - 'src/agt_mission_manager/**'
      - 'docs/acceptance/**operator-gateway**'
      - 'docs/superpowers/specs/2026-08-29-operator-gateway-p0-design.md'
      - 'docs/superpowers/specs/2026-08-29-operator-gateway-p1-mission-control-design.md'
      - 'docs/superpowers/plans/2026-08-29-operator-gateway-p0.md'
      - 'docs/superpowers/plans/2026-08-29-operator-gateway-p1-mission-control.md'
      - '.github/workflows/operator-gateway-p0.yml'
  pull_request:
    paths:
      - 'src/agt_operator_gateway/**'
      - 'src/agt_interfaces/msg/**'
      - 'src/agt_interfaces/action/**'
      - 'src/agt_interfaces/srv/**'
      - 'src/agt_mission_manager/**'
      - 'docs/acceptance/**operator-gateway**'
      - 'docs/superpowers/specs/2026-08-29-operator-gateway-p0-design.md'
      - 'docs/superpowers/specs/2026-08-29-operator-gateway-p1-mission-control-design.md'
      - 'docs/superpowers/plans/2026-08-29-operator-gateway-p0.md'
      - 'docs/superpowers/plans/2026-08-29-operator-gateway-p1-mission-control.md'
      - '.github/workflows/operator-gateway-p0.yml'

jobs:
  no-ros-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install no-ROS test dependencies
        run: python -m pip install --upgrade pytest aiohttp
      - name: Run gateway contract tests without ROS
        env:
          PYTHONPATH: src/agt_operator_gateway
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -m pytest -q
          src/agt_operator_gateway/test/test_contract.py
          src/agt_operator_gateway/test/test_state_store.py
          src/agt_operator_gateway/test/test_server_contract.py
          src/agt_operator_gateway/test/test_cors_contract.py
          src/agt_operator_gateway/test/test_ros_contract.py
          src/agt_operator_gateway/test/test_mock_gateway_contract.py
          src/agt_operator_gateway/test/test_preflight.py
          src/agt_operator_gateway/test/test_interface_compatibility.py
          src/agt_operator_gateway/test/test_command_guard.py
          src/agt_operator_gateway/test/test_mission_command_http.py
          src/agt_operator_gateway/test/test_mission_ros_contract.py
      - name: Compile Python and launch assets
        run: >-
          python -m compileall -q
          src/agt_operator_gateway/agt_operator_gateway
          src/agt_operator_gateway/scripts
          src/agt_operator_gateway/launch
