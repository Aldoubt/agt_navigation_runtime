name: Apply Inspection Mission Patch

on:
  push:
    branches:
      - feat/inspection-mvp-convergence
    paths:
      - .github/workflows/apply-inspection-mission.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inspection-mvp-convergence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Selectively port Mission inspection increments
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/inspection-multiview-evidence
          git checkout FETCH_HEAD -- \
            src/agt_mission_manager/agt_mission_manager/mission_model.py \
            src/agt_mission_manager/agt_mission_manager/mission_schema.py \
            src/agt_mission_manager/agt_mission_manager/mission_executor.py \
            src/agt_mission_manager/agt_mission_manager/mission_report.py \
            src/agt_mission_manager/agt_mission_manager/ros_task_group_runner.py \
            src/agt_mission_manager/scripts/mission_manager_node.py \
            src/agt_mission_manager/CMakeLists.txt \
            src/agt_mission_manager/package.xml \
            src/agt_interfaces/action/ExecuteMission.action \
            src/agt_interfaces/msg/MissionStatus.msg

          python - <<'PY'
          from pathlib import Path

          path = Path('src/agt_mission_manager/agt_mission_manager/mission_report.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('    def _inspection_summary(self) -> dict[str, Any]:')
          end = source.index('\n    def finish(', start)
          replacement = '''    def _inspection_summary(self) -> dict[str, Any]:\n        successful = [item for item in self._inspections if item.get("success")]\n        targets = sorted(\n            {\n                str(item.get("count_target", ""))\n                for item in successful\n                if item.get("count_target")\n            }\n        )\n        if any(item.get("count_mode") == "PENDING_OFFLINE" for item in successful):\n            return {\n                "count_targets": targets,\n                "raw_instance_count": None,\n                "point_sum_estimate": None,\n                "ambiguous_instance_count": None,\n                "count_semantics": "PENDING_OFFLINE",\n                "mission_dedup_applied": False,\n            }\n\n        raw_values = [\n            item.get("raw_instance_count")\n            for item in successful\n            if isinstance(item.get("raw_instance_count"), int)\n        ]\n        point_values = [\n            item.get("unique_instance_count")\n            for item in successful\n            if item.get("count_mode") == "POINT_DEDUP"\n            and isinstance(item.get("unique_instance_count"), int)\n        ]\n        ambiguous_values = [\n            item.get("ambiguous_instance_count")\n            for item in successful\n            if item.get("count_mode") == "POINT_DEDUP"\n            and isinstance(item.get("ambiguous_instance_count"), int)\n        ]\n        all_point_dedup = bool(successful) and len(point_values) == len(successful)\n        return {\n            "count_targets": targets,\n            "raw_instance_count": sum(raw_values) if raw_values else 0,\n            "point_sum_estimate": sum(point_values) if all_point_dedup else None,\n            "ambiguous_instance_count": (\n                sum(ambiguous_values) if all_point_dedup else None\n            ),\n            "count_semantics": "POINT_SUM_ESTIMATE" if all_point_dedup else "VIEW_RAW",\n            "mission_dedup_applied": False,\n        }\n'''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY
      - name: Run Mission inspection and legacy regressions
        run: |
          PYTHONPATH=src/agt_mission_manager:src/agt_inspection PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            python -m pytest -q \
              src/agt_mission_manager/test/test_inspection_mission_step.py \
              src/agt_mission_manager/test/test_inspection_mission_executor.py \
              src/agt_mission_manager/test/test_return_home_mission.py \
              src/agt_mission_manager/test/test_mission_report.py \
              src/agt_mission_manager/test/test_mission_schema.py \
              src/agt_mission_manager/test/test_mission_executor.py \
              src/agt_mission_manager/test/test_mission_fsm.py \
              src/agt_mission_manager/test/test_bt_mission_executor.py \
              src/agt_mission_manager/test/test_bt_backend_contract.py
          python -m compileall -q src/agt_mission_manager
      - name: Run inspection regressions after Mission interface changes
        run: |
          PYTHONPATH=src/agt_inspection PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            python -m pytest -q \
              src/agt_inspection/test/test_schema_v2.py \
              src/agt_inspection/test/test_multiview_execution.py \
              src/agt_inspection/test/test_deferred_vision.py \
              src/agt_inspection/test/test_camera_gimbal_adapter.py
      - name: Commit verified Mission implementation and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-inspection-mission.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            src/agt_mission_manager \
            src/agt_interfaces/action/ExecuteMission.action \
            src/agt_interfaces/msg/MissionStatus.msg \
            .github/workflows/apply-inspection-mission.yml
          git commit -m 'feat(mission): integrate inspection and return home flow'
          git push origin HEAD:feat/inspection-mvp-convergence
