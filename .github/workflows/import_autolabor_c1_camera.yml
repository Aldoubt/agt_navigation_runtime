name: Import Autolabor C1 camera-gimbal driver

on:
  push:
    branches:
      - feat/camera-gimbal-driver-import
    paths:
      - .github/workflows/import_autolabor_c1_camera.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: feat/camera-gimbal-driver-import
          fetch-depth: 0

      - name: Download and safely extract upstream archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=/tmp/autolabor_c1_ros2_ws.tar.gz
          EXTRACT=/tmp/autolabor_c1_extract
          SOURCE_URL='https://raw.githubusercontent.com/LJM-224/autolabor_c1_ros2_ws/main/autolabor_c1_ros2_ws_modified%281%29.tar.gz'
          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o "$ARCHIVE"
          sha256sum "$ARCHIVE" | tee /tmp/autolabor_c1_archive.sha256
          python3 - <<'PY'
          import tarfile
          from pathlib import Path

          archive = Path('/tmp/autolabor_c1_ros2_ws.tar.gz')
          extract = Path('/tmp/autolabor_c1_extract')
          with tarfile.open(archive, 'r:gz') as tf:
              members = tf.getmembers()
              for member in members:
                  p = Path(member.name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk():
                      raise SystemExit(f'archive link rejected: {member.name}')
              tf.extractall(extract)
              Path('/tmp/autolabor_c1_archive_manifest.txt').write_text(
                  ''.join(f'{m.name}\n' for m in members), encoding='utf-8')
          PY

      - name: Vendor ROS2 source packages and delivery docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          extract = Path('/tmp/autolabor_c1_extract')
          dest = Path('third_party/autolabor_c1_camera_gimbal')
          package_xmls = sorted(extract.rglob('package.xml'))
          if not package_xmls:
              raise SystemExit('No ROS package.xml found in upstream archive')

          package_dirs = [p.parent for p in package_xmls]
          common = Path(os.path.commonpath([str(p) for p in package_dirs]))
          # Expected archive layout is <workspace>/src/<packages>. If the common
          # ancestor is not named src, retain the common package tree as source.
          source_root = common
          workspace_root = common.parent if common.name == 'src' else common

          if dest.exists():
              shutil.rmtree(dest)
          (dest / 'src').parent.mkdir(parents=True, exist_ok=True)

          excluded = {'.git', 'build', 'install', 'log', '__pycache__', '.pytest_cache', '.mypy_cache'}
          def ignore(_dir, names):
              return [name for name in names if name in excluded or name.endswith('.pyc')]

          shutil.copytree(source_root, dest / 'src', ignore=ignore)

          docs = [
              'README.md', 'CAPABILITY_INTERFACE.md', 'VERIFICATION.md',
              'CODEX_ACCEPTANCE_PROMPT.md', 'HUMAN_ACCEPTANCE_CHECKLIST.md',
              'LICENSE', 'LICENSE.txt', 'NOTICE', 'NOTICE.md'
          ]
          for name in docs:
              src = workspace_root / name
              if src.is_file():
                  shutil.copy2(src, dest / name)

          tools = workspace_root / 'tools'
          if tools.is_dir():
              shutil.copytree(tools, dest / 'tools', ignore=ignore)

          shutil.copy2('/tmp/autolabor_c1_archive_manifest.txt', dest / 'UPSTREAM_ARCHIVE_MANIFEST.txt')
          sha = Path('/tmp/autolabor_c1_archive.sha256').read_text(encoding='utf-8').strip().split()[0]
          package_names = []
          for p in sorted((dest / 'src').rglob('package.xml')):
              package_names.append(str(p.parent.relative_to(dest / 'src')))
          import_doc = f'''# Autolabor C1 camera-gimbal source import\n\n- Upstream repository: https://github.com/LJM-224/autolabor_c1_ros2_ws\n- Upstream branch: `main`\n- Upstream archive: `autolabor_c1_ros2_ws_modified(1).tar.gz`\n- Upstream commit at import request: `7592b291de56c06f78a3e42a99aa74a281d7fbba`\n- Archive SHA256: `{sha}`\n- Import policy: source snapshot only; `build/`, `install/`, `log/`, Git metadata and Python caches are excluded.\n- Runtime role: camera + gimbal driver/capability; Nav2 mission logic remains outside this vendor directory.\n\n## ROS package directories\n\n''' + ''.join(f'- `{name}`\n' for name in package_names) + '''\n## Integration rule\n\nKeep device paths, runtime remaps and inspection mission orchestration outside the vendor source unless an upstream-compatible bug fix is required.\n'''
          (dest / 'UPSTREAM_IMPORT.md').write_text(import_doc, encoding='utf-8')
          print('source_root=', source_root)
          print('workspace_root=', workspace_root)
          print('packages=', len(package_names))
          print('\n'.join(package_names))
          PY

      - name: Commit imported source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import_autolabor_c1_camera.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A third_party/autolabor_c1_camera_gimbal .github/workflows/import_autolabor_c1_camera.yml
          git diff --cached --stat
          git commit -m 'feat: vendor Autolabor C1 camera-gimbal ROS2 driver'
          git push origin HEAD:feat/camera-gimbal-driver-import
