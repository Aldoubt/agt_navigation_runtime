name: Hardware Bringup No-ROS

on:
  push:
    branches:
      - feat/hardware-bringup-p0
  pull_request:
    paths:
      - 'src/agt_hardware_bringup/**'
      - 'docs/acceptance/hardware-first-vehicle-checklist.md'
      - '.github/workflows/hardware-bringup-no-ros.yml'

jobs:
  no-ros-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pyyaml
      - name: Run hardware bringup contract tests
        run: python -m pytest -q src/agt_hardware_bringup/test
      - name: Compile Python and launch files
        run: python -m compileall -q src/agt_hardware_bringup
