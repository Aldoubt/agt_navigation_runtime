name: Hardware Bringup No-ROS

on:
  push:
    branches:
      - feat/hardware-bringup-p0
  pull_request:
    paths:
      - 'src/agt_hardware_bringup/**'
      - 'src/agt_description/**'
      - 'tools/test_hardware_preflight_humble.sh'
      - 'docs/acceptance/hardware-first-vehicle-checklist.md'
      - '.github/workflows/hardware-bringup-no-ros.yml'

jobs:
  no-ros-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pyyaml
      - name: Run hardware bringup contract tests
        run: python -m pytest -q src/agt_hardware_bringup/test src/agt_description/test
      - name: Compile Python and launch files
        run: python -m compileall -q src/agt_hardware_bringup src/agt_description

  humble-install-smoke:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base-jammy
    env:
      DEBIAN_FRONTEND: noninteractive
      ROS_DISTRO: humble
    steps:
      - uses: actions/checkout@v4
      - name: Install Humble build/test tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-pytest \
            python3-yaml \
            ros-humble-ament-cmake-python \
            ros-humble-ament-cmake-pytest
      - name: Build/test/install preflight packages on Humble
        shell: bash
        run: bash tools/test_hardware_preflight_humble.sh
