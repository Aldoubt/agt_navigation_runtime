name: Field Commissioning Map

on:
  push:
    branches:
      - feat/field-commissioning-hmi-map-flow
    paths:
      - 'src/agt_field_commissioning/**'
      - 'src/agt_operator_gateway/**'
      - 'src/agt_inspection/**'
      - 'src/agt_mission_manager/**'
      - 'tests/commissioning/**'
      - '.github/workflows/field-commissioning-map.yml'
  pull_request:
    paths:
      - 'src/agt_field_commissioning/**'
      - 'src/agt_operator_gateway/**'
      - 'src/agt_inspection/**'
      - 'src/agt_mission_manager/**'
      - 'tests/commissioning/**'
      - '.github/workflows/field-commissioning-map.yml'

jobs:
  no-ros-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-contracts.txt
          python -m pip install aiohttp
      - name: Commissioning tests
        env:
          PYTHONPATH: src/agt_field_commissioning:src/agt_operator_gateway:src/agt_inspection:src/agt_mission_manager:src/agt_navigation:src/agt_site_runtime:src/agt_runtime_contracts
        run: python -m pytest -q tests/commissioning
      - name: Gateway pure-Python tests
        env:
          PYTHONPATH: src/agt_operator_gateway:src/agt_field_commissioning:src/agt_inspection:src/agt_mission_manager:src/agt_navigation:src/agt_site_runtime:src/agt_runtime_contracts
        run: python -m pytest -q src/agt_operator_gateway/test
      - name: Compile changed Python packages
        run: python -m compileall -q src/agt_field_commissioning src/agt_operator_gateway src/agt_inspection/agt_inspection src/agt_mission_manager/agt_mission_manager src/agt_navigation/agt_navigation

  humble-projector:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base-jammy
    env:
      DEBIAN_FRONTEND: noninteractive
      ROS_DISTRO: humble
    steps:
      - uses: actions/checkout@v4
      - name: Install projector build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            ros-humble-rtabmap \
            libpcl-dev
      - name: Build commissioning projector on Humble
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --event-handlers console_direct+ \
            --packages-select agt_field_commissioning \
            --cmake-args -DBUILD_TESTING=OFF
      - name: Verify installed projector executable
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          PROJECTOR="$(ros2 pkg prefix agt_field_commissioning)/lib/agt_field_commissioning/rtabmap_grid_projector"
          test -x "$PROJECTOR"
          "$PROJECTOR" 2>&1 | grep -F -- '--input, --output-pgm and --output-yaml are required'
