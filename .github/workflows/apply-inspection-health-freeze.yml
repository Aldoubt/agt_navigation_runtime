name: Apply Inspection Health Freeze

on:
  push:
    branches:
      - feat/inspection-mvp-convergence
    paths:
      - .github/workflows/apply-inspection-health-freeze.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inspection-mvp-convergence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Wire camera gimbal health gate and Humble tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          server = Path('src/agt_inspection/scripts/inspection_task_server.py')
          source = server.read_text(encoding='utf-8')

          old = 'from action_msgs.msg import GoalStatus\nfrom nav_msgs.msg import Odometry\n'
          new = 'from action_msgs.msg import GoalStatus\nfrom camera_gimbal_interfaces.msg import CapabilityHealth\nfrom nav_msgs.msg import Odometry\n'
          if old not in source:
              raise SystemExit('server import anchor not found')
          source = source.replace(old, new, 1)

          old = 'from agt_inspection.evidence import EvidenceWriter\n'
          new = 'from agt_inspection.camera_gimbal_health import CameraGimbalHealthGate\nfrom agt_inspection.evidence import EvidenceWriter\n'
          if old not in source:
              raise SystemExit('health import anchor not found')
          source = source.replace(old, new, 1)

          old = '''        if self._view_backend not in {"legacy", "camera_gimbal"}:\n            raise ValueError("view_backend must be legacy or camera_gimbal")\n\n        image_cache: dict[str, Image] = {}\n'''
          new = '''        if self._view_backend not in {"legacy", "camera_gimbal"}:\n            raise ValueError("view_backend must be legacy or camera_gimbal")\n\n        health_freshness_s = float(\n            self.declare_parameter("camera_gimbal_health_freshness_s", 1.5).value\n        )\n        self._camera_gimbal_health = CameraGimbalHealthGate(\n            freshness_s=health_freshness_s\n        )\n        self._camera_gimbal_health_subscription = None\n        if self._view_backend == "camera_gimbal":\n            self._camera_gimbal_health_subscription = self.create_subscription(\n                CapabilityHealth,\n                "/camera_gimbal/health",\n                self._camera_gimbal_health_callback,\n                10,\n                callback_group=ReentrantCallbackGroup(),\n            )\n\n        image_cache: dict[str, Image] = {}\n'''
          if old not in source:
              raise SystemExit('health init anchor not found')
          source = source.replace(old, new, 1)

          old = '''    def _goal(self, request: ExecuteInspectionTask.Goal) -> GoalResponse:\n        required = (\n'''
          new = '''    def _camera_gimbal_health_callback(self, message: CapabilityHealth) -> None:\n        self._camera_gimbal_health.update(\n            state=int(message.state),\n            camera_alive=bool(message.camera_alive),\n            gimbal_serial_connected=bool(message.gimbal_serial_connected),\n            gimbal_feedback_alive=bool(message.gimbal_feedback_alive),\n            move_action_ready=bool(message.move_action_ready),\n            busy=bool(message.busy),\n            seen_monotonic=time.monotonic(),\n        )\n\n    def _goal(self, request: ExecuteInspectionTask.Goal) -> GoalResponse:\n        required = (\n'''
          if old not in source:
              raise SystemExit('goal method anchor not found')
          source = source.replace(old, new, 1)

          old = '''        if (\n            self._active_executor is not None\n            or not all(required)\n            or request.task_revision == 0\n        ):\n            return GoalResponse.REJECT\n        return GoalResponse.ACCEPT\n'''
          new = '''        if (\n            self._active_executor is not None\n            or not all(required)\n            or request.task_revision == 0\n        ):\n            return GoalResponse.REJECT\n        if (\n            self._view_backend == "camera_gimbal"\n            and not self._camera_gimbal_health.ready(time.monotonic())\n        ):\n            self.get_logger().warning(\n                "rejecting inspection goal: camera-gimbal health gate is not READY: %s"\n                % self._camera_gimbal_health.reason(time.monotonic())\n            )\n            return GoalResponse.REJECT\n        return GoalResponse.ACCEPT\n'''
          if old not in source:
              raise SystemExit('goal gate anchor not found')
          source = source.replace(old, new, 1)
          server.write_text(source, encoding='utf-8')

          cmake = Path('src/agt_inspection/CMakeLists.txt')
          source = cmake.read_text(encoding='utf-8')
          anchor = '  ament_add_pytest_test(test_inspection_multiview_execution test/test_multiview_execution.py)\n'
          additions = '''  ament_add_pytest_test(test_inspection_multiview_execution test/test_multiview_execution.py)\n  ament_add_pytest_test(test_deferred_vision test/test_deferred_vision.py)\n  ament_add_pytest_test(test_camera_gimbal_adapter test/test_camera_gimbal_adapter.py)\n  ament_add_pytest_test(test_atomic_view_acquisition test/test_atomic_view_acquisition.py)\n  ament_add_pytest_test(test_camera_gimbal_health test/test_camera_gimbal_health.py)\n'''
          if anchor not in source:
              raise SystemExit('CMake pytest anchor not found')
          source = source.replace(anchor, additions, 1)
          cmake.write_text(source, encoding='utf-8')

          workflow = Path('.github/workflows/inspection-mvp.yml')
          source = workflow.read_text(encoding='utf-8')
          anchor = '              src/agt_inspection/test/test_atomic_view_acquisition.py\n'
          replacement = anchor + '              src/agt_inspection/test/test_camera_gimbal_health.py\n'
          if anchor not in source:
              raise SystemExit('inspection CI anchor not found')
          source = source.replace(anchor, replacement, 1)
          workflow.write_text(source, encoding='utf-8')
          PY
      - name: Run freeze static contracts
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q tests/inspection
      - name: Run inspection pure Python freeze suite
        run: |
          PYTHONPATH=src/agt_inspection PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            python -m pytest -q \
              src/agt_inspection/test/test_schema_v2.py \
              src/agt_inspection/test/test_multiview_execution.py \
              src/agt_inspection/test/test_deferred_vision.py \
              src/agt_inspection/test/test_camera_gimbal_adapter.py \
              src/agt_inspection/test/test_atomic_view_acquisition.py \
              src/agt_inspection/test/test_camera_gimbal_health.py
      - name: Run Mission freeze regression
        run: |
          PYTHONPATH=src/agt_mission_manager:src/agt_inspection PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            python -m pytest -q \
              src/agt_mission_manager/test/test_inspection_mission_step.py \
              src/agt_mission_manager/test/test_inspection_mission_executor.py \
              src/agt_mission_manager/test/test_return_home_mission.py \
              src/agt_mission_manager/test/test_mission_report.py \
              src/agt_mission_manager/test/test_mission_schema.py \
              src/agt_mission_manager/test/test_mission_executor.py \
              src/agt_mission_manager/test/test_mission_fsm.py
      - name: Compile Python
        run: python -m compileall -q src/agt_inspection src/agt_mission_manager
      - name: Commit verified health freeze and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-inspection-health-freeze.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            src/agt_inspection/scripts/inspection_task_server.py \
            src/agt_inspection/CMakeLists.txt \
            .github/workflows/inspection-mvp.yml \
            .github/workflows/apply-inspection-health-freeze.yml
          git commit -m 'fix(inspection): gate real missions on fresh camera gimbal health'
          git push origin HEAD:feat/inspection-mvp-convergence
