planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 0.5
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.0
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 15.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      minimum_turning_radius: 1.50
      analytic_expansion_ratio: 3.5
      # Nav2 recommends 4-5x the minimum turning radius or more.
      analytic_expansion_max_length: 7.50
      cost_travel_multiplier: 2.0
      reverse_penalty: 2.1
      change_penalty: 0.0
      non_straight_penalty: 1.20
      cost_penalty: 2.0
      retrospective_penalty: 0.025
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      # Planner-only preview uses explicit start poses and does not own TF.
      robot_base_frame: map
      resolution: 0.05
      track_unknown_space: true
      # Manufacturer 0.84 x 0.60 m chassis envelope, centred only for preview.
      # Vehicle-ready acceptance remains blocked until base_footprint reference
      # and final mounted envelope are verified on the physical robot.
      footprint: "[[0.420, 0.300], [0.420, -0.300], [-0.420, -0.300], [-0.420, 0.300]]"
      footprint_padding: 0.0
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /agt/map/global_occupancy
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.75
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: true
