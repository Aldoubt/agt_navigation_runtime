planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 0.5
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      # P1-F4 changes only costmap UNKNOWN inflation semantics.
      tolerance: 0.0
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 15.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      # Planner-only smoke tests use explicit start poses and do not own TF.
      robot_base_frame: map
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.20
      footprint_padding: 0.0
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /agt/map/global_occupancy
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.75
        inflate_unknown: false
        inflate_around_unknown: true
      always_send_full_costmap: true
