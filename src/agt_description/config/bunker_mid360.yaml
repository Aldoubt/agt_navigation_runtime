/**:
  ros__parameters:
    # Chassis outer dimensions come from the supplied product drawing.
    calibration_verified: false
    base_length: 1.023
    base_width: 0.778
    base_height: 0.400
    # Provisional until the physical base_link datum is measured.
    base_link_z: 0.200
    # Initial calibration candidate sourced from
    # agt_description/config/cad_alignment.initial_guess.yaml
    # and adjusted using the stationary-start IMU gravity direction in
    # runtime/rosbag/bunker_mid360_mapping_20260901_211105 (about 14.8 deg).
    # Keep this candidate-only value until physical/RViz validation is complete.
    # The MID360 center is on the
    # longitudinal centerline, 0.250 m behind the 1.023 m chassis front edge,
    # and approximately 0.607 m above the ground. With base_link at the
    # provisional chassis geometric center and base_link_z=0.200 m, this gives
    # lidar_z=0.4070 m. Physical measurement is still required.
    lidar_x: 0.2615
    lidar_y: 0.0
    lidar_z: 0.4070
    # Static-bag ground-plane and IMU estimates: roll ~= +0.37 deg and
    # positive ROS pitch ~= +14.8 deg toward the chassis front (+X).
    lidar_roll: 0.0064
    lidar_pitch: 0.2580
    lidar_yaw: 0.0
