agt_tracked_safety_controller:
  ros__parameters:
    startup_motion_enabled: false
    require_localization_valid: true
    # Tracking validation publishes every 5 s and may spend up to 3 s in NDT.
    # Keep the runtime freshness window above that worst-case interval.
    localization_status_timeout: 10.0
    require_sensor_input_ready: true
    sensor_status_timeout: 1.5
    sensor_diagnostics_topic: /diagnostics
    sensor_summary_name: agt_sensor_monitor/summary
    navigation_timeout: 0.50
    manual_timeout: 0.35
    publish_rate: 20.0
    max_forward_speed: 0.50
    max_reverse_speed: 0.25
    max_angular_speed: 0.60
    max_track_speed: 0.65
    # Estimated track center distance; replace after physical measurement.
    effective_track_width: 0.62
    max_linear_acceleration: 0.35
    max_linear_deceleration: 0.70
    max_angular_acceleration: 0.80
    max_angular_deceleration: 1.20
