agt_operator_gateway:
  ros__parameters:
    host: 0.0.0.0
    port: 8765
    robot_id: agt-robot
    robot_name: AGT Robot
    robot_state_topic: /agt/system/robot_state
    runtime_freshness_ms: 1500
    offline_after_ms: 5000
    stream_poll_s: 0.05

    # P1 mission writes are opt-in. The node also requires the
    # AGT_OPERATOR_COMMAND_TOKEN environment variable before creating any
    # Mission ROS write clients; otherwise it remains read-only.
    write_api_enabled: false
    mission_command_timeout_s: 5.0

    # Wildcard browser access is acceptable while the write API is disabled.
    # Before setting write_api_enabled=true on a robot, replace this with the
    # explicit HMI origin(s), for example http://operator-laptop.local:5173.
    cors_allowed_origins:
      - '*'
