agt_livox_self_filter:
  ros__parameters:
    input_topic: /agt/sensors/lidar/custom
    output_topic: /agt/sensors/lidar/custom_filtered
    platform_profile: ""
    enabled: true
    transform_timeout_sec: 0.10
    zero_point_epsilon: 0.000001
    fail_open_on_tf_error: false
    publish_removed_points: false
    removed_points_topic: /agt/sensors/lidar/self_filter/removed_points
    publish_filter_boxes: true
    filter_boxes_topic: /agt/sensors/lidar/self_filter/boxes
    diagnostics_topic: /diagnostics
    queue_depth: 200000
